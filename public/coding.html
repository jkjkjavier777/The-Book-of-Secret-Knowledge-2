<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Assistant</title>
<style>
  body { font-family: monospace; background: #0b0b0b; color: #d6d6d6; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #9fd6ff; font-size: 1.1rem; }
  #log { border: 1px solid #333; padding: 12px; height: 65vh; overflow-y: auto; white-space: pre-wrap; background: #111; }
  .you { color: #9fd6ff; }
  .bot { color: #d6d6d6; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input, select { flex: 1; background: #111; color: #eee; border: 1px solid #333; padding: 8px; font-family: monospace; }
  select { flex: 0 0 auto; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Coding Assistant</h1>
  <div id="log"></div>
  <form id="chat-form">
    <select id="persona">
      <option value="bge" selected>BoundedGlitchEngine</option>
      <option value="bosk">Guardian (bosk)</option>
    </select>
    <input id="input" autocomplete="off" placeholder="Ask a coding question..." />
    <button type="submit">Send</button>
  </form>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const personaSelect = document.getElementById('persona');

  function append(who, text) {
    const div = document.createElement('div');
    div.className = who === 'you' ? 'you' : 'bot';
    div.textContent = (who === 'you' ? 'You: ' : 'Bot: ') + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    append('you', text);
    input.value = '';
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, persona: personaSelect.value }),
      });
      const data = await res.json();
      append('bot', data.reply || data.error || 'No response.');
    } catch (err) {
      append('bot', 'Connection error: ' + err.message);
    }
  });
</script>
</body>
</html>
